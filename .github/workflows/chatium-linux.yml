# Builds the linux tsc of the @chatium/tsc-rs packages on GitHub-hosted runners, as the build job of
# release.yml does: static musl, non-PIE, jemalloc with bin/tsgo.rs JEMALLOC_CONF built in. arm64
# jemalloc assumes 64 KiB pages, so the tsc also runs on 16 and 64 KiB page kernels (as ruff and uv).
# scripts/goport/chatium-pack.sh packs the packages from its artifact and a macOS build.
name: Chatium linux

on:
  push:
    branches: [chatium]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The toolchain of release.yml.
  RUSTUP_TOOLCHAIN: 1.95.0

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - platform: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            lg_page: 16
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      # The fat-LTO build needs more disk and memory than a standard runner leaves free.
      - name: Free disk space, add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo mkdir -p /mnt && sudo fallocate -l 12G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          df -h / /mnt && free -h
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
      - run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - name: Build
        env:
          JEMALLOC_SYS_WITH_LG_PAGE: ${{ matrix.lg_page }}
        run: |
          [[ -n $JEMALLOC_SYS_WITH_LG_PAGE ]] || unset JEMALLOC_SYS_WITH_LG_PAGE
          target=${{ matrix.target }}
          export "CC_${target//-/_}=musl-gcc"
          export RUSTFLAGS="-C target-feature=+crt-static -C relocation-model=static"
          JEMALLOC_SYS_WITH_MALLOC_CONF=$(sed -n 's/^const JEMALLOC_CONF: &str = "\([^"]*\)";$/\1/p' crates/ts_goport/src/bin/tsgo.rs | head -1)
          [[ -n $JEMALLOC_SYS_WITH_MALLOC_CONF ]] || { echo "::error::no JEMALLOC_CONF in bin/tsgo.rs"; exit 1; }
          export JEMALLOC_SYS_WITH_MALLOC_CONF
          cargo build --profile goport --locked -p ts_goport --bin tsgo --features noembed --target "$target"
          mkdir -p "$RUNNER_TEMP/out"
          cp "target/$target/goport/tsgo" "$RUNNER_TEMP/out/tsc"
          git rev-parse HEAD > "$RUNNER_TEMP/out/COMMIT"
      - name: Check the tsc
        run: |
          out="$RUNNER_TEMP/out"
          dir="$RUNNER_TEMP/check"
          crates/ts_goport/scripts/copy-libs.sh "$dir"
          cp "$out/tsc" "$dir/tsc"
          [[ $("$dir/tsc" --version) == "Version 7."* ]]
          cd "$RUNNER_TEMP"
          echo 'const x: number = "a";' > a.ts
          "$dir/tsc" --listFilesOnly --lib es5 a.ts | grep -qx "$dir/lib.es5.d.ts"
          set +e
          "$dir/tsc" --noEmit a.ts > check.txt
          rc=$?
          set -e
          cat check.txt
          [[ $rc == 2 ]] && grep -q "error TS2322" check.txt
          file "$dir/tsc" | tee /dev/stderr | grep -q "statically linked"
          # Static: it starts on musl (Alpine) too.
          docker run --rm -v "$dir:/t:ro" alpine:3 /t/tsc --version
      - uses: actions/upload-artifact@v4
        with:
          name: tsc-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/out/tsc
            ${{ runner.temp }}/out/COMMIT
          if-no-files-found: error
